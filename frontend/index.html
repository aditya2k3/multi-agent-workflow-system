<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Assistant</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --bg-hover: #333333;
            --text-primary: #ececec;
            --text-secondary: #9ca3af;
            --accent: #4f7df9;
            --accent-hover: #3b6ae8;
            --border: #2e2e2e;
            --msg-user-bg: #2b2b2b;
            --sidebar-width: 280px;
            --radius: 12px;
            --transition: 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* === SIDEBAR === */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            transition: transform var(--transition);
            flex-shrink: 0;
        }
        .sidebar-header { display: flex; align-items: center; gap: 10px; padding: 8px 12px 20px; }
        .logo { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; }
        .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
        .new-chat-btn {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text-primary); cursor: pointer;
            font-size: 14px; font-weight: 500;
            transition: all var(--transition); margin-bottom: 16px;
        }
        .new-chat-btn:hover { background: var(--bg-hover); border-color: var(--accent); }
        .nav-section-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-secondary); padding: 8px 12px 6px; font-weight: 600;
        }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: 10px; border: none;
            background: transparent; color: var(--text-secondary);
            cursor: pointer; font-size: 14px;
            transition: all var(--transition); width: 100%; text-align: left;
        }
        .nav-item i { font-size: 18px; }
        .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .nav-item.active { background: var(--bg-tertiary); color: var(--text-primary); font-weight: 500; }
        .sidebar-footer { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
        .user-profile { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-top: 4px; }
        .avatar {
            width: 32px; height: 32px; border-radius: 50%; background: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: white;
        }

        /* === MAIN CONTENT === */
        .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
        .chat-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .mobile-toggle { display: none; background: none; border: none; color: var(--text-primary); font-size: 22px; cursor: pointer; }
        .model-selector { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .model-selector i { font-size: 12px; color: var(--text-secondary); }

        /* === MESSAGES === */
        .messages-container { flex: 1; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 16px; }
        .welcome-icon { font-size: 48px; color: var(--accent); margin-bottom: 8px; }
        .welcome-screen h2 { font-size: 22px; font-weight: 600; }
        .suggestion-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; max-width: 600px; }
        .chip {
            padding: 10px 16px; background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 20px; color: var(--text-secondary); font-size: 13px;
            cursor: pointer; transition: all var(--transition);
        }
        .chip:hover { border-color: var(--accent); color: var(--text-primary); background: var(--bg-tertiary); }
        .message { max-width: 768px; margin: 0 auto 24px; display: flex; gap: 16px; line-height: 1.7; font-size: 15px; }
        .message.user { justify-content: flex-end; }
        .message.user .message-content { background: var(--msg-user-bg); padding: 12px 18px; border-radius: 18px 18px 4px 18px; max-width: 80%; }
        .message.ai { justify-content: flex-start; }
        .message.ai .message-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: var(--accent);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; color: white;
        }
        .message.ai .message-content { padding-top: 4px; }
        .typing-indicator span {
            display: inline-block; width: 6px; height: 6px; background: var(--text-secondary);
            border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; margin: 0 2px;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* === MARKDOWN STYLING FOR AI RESPONSES === */
        .message-content h1 {
            font-size: 20px; font-weight: 700; color: var(--accent);
            margin: 20px 0 12px; padding-bottom: 6px;
            border-bottom: 2px solid var(--accent);
        }
        .message-content h2 {
            font-size: 17px; font-weight: 700; color: var(--text-primary);
            margin: 18px 0 10px; padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }
        .message-content h3 {
            font-size: 15px; font-weight: 600; color: var(--text-primary);
            margin: 14px 0 8px;
        }
        .message-content p { margin: 8px 0; }
        .message-content ul, .message-content ol {
            margin: 8px 0; padding-left: 24px;
        }
        .message-content li { margin: 4px 0; }
        .message-content strong { color: var(--accent); font-weight: 700; }
        .message-content em { font-style: italic; color: var(--text-secondary); }
        .message-content hr {
            border: none; border-top: 1px solid var(--border);
            margin: 16px 0;
        }
        .message-content table {
            width: 100%; border-collapse: collapse; margin: 12px 0;
            font-size: 13px; border: 1px solid var(--border);
        }
        .message-content th {
            background: var(--bg-tertiary); color: var(--accent);
            padding: 8px 12px; text-align: left; font-weight: 600;
            border: 1px solid var(--border);
        }
        .message-content td {
            padding: 8px 12px; border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .message-content tr:nth-child(even) td {
            background: var(--bg-secondary);
        }
        .message-content pre {
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px; margin: 10px 0;
            overflow-x: auto; font-size: 13px;
        }
        .message-content code {
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .message-content p code, .message-content li code {
            background: var(--bg-tertiary); padding: 2px 6px;
            border-radius: 4px; font-size: 13px; color: var(--accent);
        }

        /* === FILE BADGE === */
        .file-badge {
            display: none; align-items: center; gap: 6px;
            padding: 6px 12px; background: var(--bg-tertiary); border: 1px solid var(--accent);
            border-radius: 8px; font-size: 12px; color: var(--accent);
            max-width: 768px; margin: 0 auto 8px;
        }
        .file-badge.visible { display: flex; }
        .file-badge .remove-file { cursor: pointer; margin-left: auto; font-size: 14px; }
        .file-badge .remove-file:hover { color: #ff6b6b; }

        /* === INTENT BADGE === */
        .intent-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .intent-meeting  { background: #2d5a27; color: #7fff7f; }
        .intent-upload   { background: #5a2727; color: #ff7f7f; }
        .intent-research { background: #27385a; color: #7fb3ff; }
        .intent-schedule { background: #5a4a27; color: #ffd77f; }
        .intent-email    { background: #4a275a; color: #d77fff; }
        .intent-chat     { background: #333;    color: #aaa; }

        /* === INPUT AREA === */
        .input-area { padding: 16px 24px 20px; flex-shrink: 0; }
        .input-wrapper {
            max-width: 768px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 16px; padding: 8px 12px; transition: border-color var(--transition);
        }
        .input-wrapper:focus-within { border-color: var(--accent); }
        .attach-btn, .send-btn {
            background: none; border: none; cursor: pointer; width: 36px; height: 36px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; transition: all var(--transition); flex-shrink: 0;
        }
        .attach-btn { color: var(--text-secondary); }
        .attach-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .send-btn { background: var(--accent); color: white; }
        .send-btn:disabled { background: var(--bg-tertiary); color: var(--text-secondary); cursor: default; }
        .send-btn:not(:disabled):hover { background: var(--accent-hover); }
        #queryInput {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-primary); font-size: 15px; resize: none;
            max-height: 150px; padding: 8px 4px; font-family: inherit; line-height: 1.5;
        }
        #queryInput::placeholder { color: var(--text-secondary); }
        .disclaimer { text-align: center; font-size: 11px; color: var(--text-secondary); margin-top: 8px; max-width: 768px; margin-left: auto; margin-right: auto; }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .mobile-toggle { display: block; }
            .messages-container { padding: 16px; }
            .input-area { padding: 12px 16px 16px; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--bg-hover); }
    </style>
</head>
<body>
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="assets/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            <span class="brand-name">Enterprise AI Platform</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn"><i class="ph ph-plus"></i> New Analysis</button>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Business Tools</div>
            <button class="nav-item active" data-feature="chat"><i class="ph ph-chats-circle"></i><span>AI Assistant</span></button>
            <button class="nav-item" data-feature="email"><i class="ph ph-envelope-simple"></i><span>Email Assistant</span></button>
            <button class="nav-item" data-feature="pdf-extract"><i class="ph ph-file-pdf"></i><span>PDF Knowledge Base</span></button>
            <button class="nav-item" data-feature="meeting-summary"><i class="ph ph-users-three"></i><span>Meeting Summaries</span></button>
            <button class="nav-item" data-feature="schedule"><i class="ph ph-calendar-check"></i><span>Schedule Event</span></button>
            <button class="nav-item" data-feature="tavily-research"><i class="ph ph-globe-simple"></i><span>Deep Research</span></button>
        </nav>
        <div class="sidebar-footer">
            <button class="nav-item"><i class="ph ph-gear"></i><span>Settings</span></button>
            <div class="user-profile"><div class="avatar">AG</div><span>Aditya Gupta</span></div>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="main-content">
        <header class="chat-header">
            <button class="mobile-toggle" id="sidebarToggle"><i class="ph ph-list"></i></button>
            <div class="model-selector"><span class="model-name">Enterprise AI Platform</span><i class="ph ph-caret-down"></i></div>
        </header>
        <div class="messages-container" id="messagesContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-icon"><i class="ph ph-brain"></i></div>
                <h2>How can I assist your business today?</h2>
                <div class="suggestion-chips">
                    <button class="chip" data-prompt="Summarize last week's board meeting">📋 Summarize board meeting</button>
                    <button class="chip" data-prompt="Research Q3 market trends in SaaS">🔍 Deep Research</button>
                    <button class="chip" data-prompt="Draft a thank you email to the team for the successful launch">📧 Draft email</button>
                    <button class="chip" data-prompt="Schedule a sync with the engineering team on Friday at 2pm">📅 Schedule team sync</button>
                </div>
            </div>
        </div>
        <div class="input-area">
            <div class="file-badge" id="fileBadge">
                <i class="ph ph-file-pdf"></i>
                <span id="fileName"></span>
                <span class="remove-file" id="removeFile"><i class="ph ph-x"></i></span>
            </div>
            <div class="input-wrapper">
                <button class="attach-btn" id="attachBtn" title="Attach file"><i class="ph ph-paperclip"></i></button>
                <textarea id="queryInput" placeholder="Ask anything — I'll route to the right agent automatically..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" disabled><i class="ph ph-arrow-up"></i></button>
            </div>
            <p class="disclaimer">AI may produce inaccurate information. Verify critical business decisions.</p>
        </div>
    </main>

    <script>
        // =============================================
        // CONFIGURATION
        // =============================================
        const API_BASE = 'http://127.0.0.1:8000';

        // =============================================
        // DOM ELEMENTS
        // =============================================
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const newChatBtn = document.getElementById('newChatBtn');
        const navItems = document.querySelectorAll('.nav-item[data-feature]');
        const suggestionChips = document.querySelectorAll('.chip');
        const attachBtn = document.getElementById('attachBtn');
        const fileBadge = document.getElementById('fileBadge');
        const fileNameEl = document.getElementById('fileName');
        const removeFileBtn = document.getElementById('removeFile');

        // =============================================
        // STATE
        // =============================================
        let currentFeature = 'chat';
        let isProcessing = false;
        let selectedFile = null;

        // =============================================
        // FILE ATTACHMENT HANDLER
        // =============================================
        attachBtn.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.pdf,.txt,.csv';
            input.onchange = (e) => {
                selectedFile = e.target.files[0];
                if (selectedFile) {
                    fileNameEl.textContent = selectedFile.name;
                    fileBadge.classList.add('visible');
                    attachBtn.querySelector('i').style.color = 'var(--accent)';
                    queryInput.placeholder = 'Add instructions for this file or press send...';
                    sendBtn.disabled = false;
                }
            };
            input.click();
        });

        removeFileBtn.addEventListener('click', () => {
            selectedFile = null;
            fileBadge.classList.remove('visible');
            attachBtn.querySelector('i').style.color = '';
            queryInput.placeholder = 'Ask anything — I\'ll route to the right agent automatically...';
            sendBtn.disabled = !queryInput.value.trim();
        });

        // =============================================
        // EVENT LISTENERS
        // =============================================
        sendBtn.addEventListener('click', handleSend);

        queryInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        queryInput.addEventListener('input', () => {
            autoResize();
            sendBtn.disabled = !queryInput.value.trim() && !selectedFile;
        });

        sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
        newChatBtn.addEventListener('click', resetChat);

        navItems.forEach(item => {
            item.addEventListener('click', () => switchFeature(item.dataset.feature));
        });

        suggestionChips.forEach(chip => {
            chip.addEventListener('click', () => {
                queryInput.value = chip.dataset.prompt;
                sendBtn.disabled = false;
                autoResize();
                handleSend();
            });
        });

        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768 &&
                sidebar.classList.contains('open') &&
                !sidebar.contains(e.target) &&
                e.target !== sidebarToggle) {
                sidebar.classList.remove('open');
            }
        });

        // =============================================
        // CORE SEND FUNCTION
        // =============================================
        async function handleSend() {
            const text = queryInput.value.trim();
            if ((!text && !selectedFile) || isProcessing) return;

            welcomeScreen.style.display = 'none';

            const displayText = selectedFile
                ? '📎 ' + selectedFile.name + ' — ' + (text || 'Analyze this document')
                : text;
            addMessage(displayText, 'user');

            queryInput.value = '';
            queryInput.style.height = 'auto';
            sendBtn.disabled = true;
            isProcessing = true;

            const typingId = showTyping();

            try {
                let res;

                if (selectedFile) {
                    const formData = new FormData();
                    formData.append('file', selectedFile);
                    formData.append('query', text);

                    res = await fetch(API_BASE + '/router/chat-with-file', {
                        method: 'POST',
                        body: formData,
                    });
                } else {
                    res = await fetch(API_BASE + '/router/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: text }),
                    });
                }

                removeTyping(typingId);

                if (!res.ok) throw new Error('API Error: ' + res.status);

                const data = await res.json();

                const badge = getIntentBadge(data.intent);
                addMessage(badge + (data.response || 'No response received.'), 'ai');

            } catch (err) {
                removeTyping(typingId);
                addMessage('⚠️ Error: ' + err.message, 'ai');
            } finally {
                isProcessing = false;
                sendBtn.disabled = !queryInput.value.trim() && !selectedFile;
                selectedFile = null;
                fileBadge.classList.remove('visible');
                attachBtn.querySelector('i').style.color = '';
                scrollToBottom();
            }
        }

        // =============================================
        // INTENT BADGE
        // =============================================
        function getIntentBadge(intent) {
            const badges = {
                'meeting':  '<span class="intent-badge intent-meeting">📋 Meeting Agent</span><br>',
                'upload':   '<span class="intent-badge intent-upload">📄 Upload Agent</span><br>',
                'research': '<span class="intent-badge intent-research">🔍 Research Agent</span><br>',
                'schedule': '<span class="intent-badge intent-schedule">📅 Schedule Agent</span><br>',
                'email':    '<span class="intent-badge intent-email">📧 Email Agent</span><br>',
                'chat':     '<span class="intent-badge intent-chat">💬 General Chat</span><br>',
            };
            return badges[intent] || badges['chat'];
        }

        // =============================================
        // HELPER FUNCTIONS
        // =============================================
        function addMessage(content, role) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            if (role === 'ai') {
                div.innerHTML = '<div class="message-avatar"><i class="ph ph-brain"></i></div><div class="message-content">' + formatMd(content) + '</div>';
            } else {
                div.innerHTML = '<div class="message-content">' + escHtml(content) + '</div>';
            }
            messagesContainer.appendChild(div);
            scrollToBottom();
        }

        function showTyping() {
            const id = 't' + Date.now();
            const d = document.createElement('div');
            d.id = id;
            d.className = 'message ai';
            d.innerHTML = '<div class="message-avatar"><i class="ph ph-brain"></i></div><div class="message-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
            messagesContainer.appendChild(d);
            scrollToBottom();
            return id;
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function switchFeature(f) {
            currentFeature = f;
            navItems.forEach(i => i.classList.toggle('active', i.dataset.feature === f));

            const placeholders = {
                'chat':              'Ask anything — I\'ll route to the right agent automatically...',
                'email':             'Draft an email: "Write a follow-up to John about Q3 report"',
                'pdf-extract':       'Click 📎 to upload a PDF, or describe what you need...',
                'meeting-summary':   'Paste a meeting transcript or describe the meeting...',
                'schedule':          'Describe the event: "Schedule a call with John on Friday at 2pm"',
                'tavily-research':   'Enter a research query: "Q3 SaaS market trends"'
            };
            queryInput.placeholder = placeholders[f] || placeholders['chat'];

            sidebar.classList.remove('open');
            queryInput.focus();
        }

        function autoResize() {
            queryInput.style.height = 'auto';
            queryInput.style.height = Math.min(queryInput.scrollHeight, 150) + 'px';
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function resetChat() {
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(welcomeScreen);
            welcomeScreen.style.display = 'flex';
            queryInput.value = '';
            sendBtn.disabled = true;
            selectedFile = null;
            fileBadge.classList.remove('visible');
            attachBtn.querySelector('i').style.color = '';
            autoResize();
        }

        function escHtml(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        // =============================================
        // COMPREHENSIVE MARKDOWN FORMATTER
        // =============================================
        function formatMd(t) {
            if (!t) return '';
            
            let html = t;
            
            // 1. Code blocks first (prevent inner processing)
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
                return '<pre><code>' + escHtml(code.trim()) + '</code></pre>';
            });
            html = html.replace(/```([\s\S]*?)```/g, function(match, code) {
                return '<pre><code>' + escHtml(code.trim()) + '</code></pre>';
            });
            
            // 2. Tables
            html = html.replace(/^\|(.+)\|\s*\n\|[-| :]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm, function(match, headerRow, bodyRows) {
                const headers = headerRow.split('|').map(h => h.trim()).filter(h => h);
                let table = '<table><thead><tr>';
                headers.forEach(h => { table += '<th>' + h + '</th>'; });
                table += '</tr></thead><tbody>';
                
                const rows = bodyRows.trim().split('\n');
                rows.forEach(row => {
                    const cells = row.split('|').map(c => c.trim()).filter(c => c);
                    if (cells.length > 0) {
                        table += '<tr>';
                        cells.forEach(c => { table += '<td>' + c + '</td>'; });
                        table += '</tr>';
                    }
                });
                table += '</tbody></table>';
                return table;
            });
            
            // 3. Headers
            html = html.replace(/^#### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
            
            // 4. Horizontal rules
            html = html.replace(/^---+$/gm, '<hr>');
            
            // 5. Bold and italic
            html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            
            // 6. Inline code (not inside pre blocks)
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // 7. Bullet lists
            html = html.replace(/^[\s]*[-*]\s+(.+)$/gm, '<li>$1</li>');
            
            // 8. Numbered lists
            html = html.replace(/^[\s]*(\d+)\.\s+(.+)$/gm, '<li>$2</li>');
            
            // 9. Wrap consecutive list items
            html = html.replace(/((?:<li>.*?<\/li>\n?)+)/g, function(match) {
                return '<ul>' + match + '</ul>';
            });
            
            // 10. Paragraphs - split by double newlines
            const blocks = html.split(/\n\n+/);
            html = blocks.map(block => {
                block = block.trim();
                if (!block) return '';
                if (/^<(h[1-6]|ul|ol|li|pre|table|hr|div|p)/.test(block)) {
                    return block;
                }
                block = block.replace(/\n/g, '<br>');
                return '<p>' + block + '</p>';
            }).join('\n');
            
            // 11. Clean up
            html = html.replace(/<p>\s*<\/p>/g, '');
            
            return html;
        }
    </script>
</body>
</html>
